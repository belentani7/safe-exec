# SAFE-EXEC static policy. Versioned: any change alters policy_version in
# evaluation requests, so votes cannot be replayed across policies.
version: safeexec-1

# Imports whose mere presence justifies a denial in the default profile.
blocked_imports:
  - ctypes
  - multiprocessing
  - pty

# Canonical callables (resolved through import aliases and simple assignments).
blocked_calls:
  - eval
  - exec
  - compile
  - breakpoint
  - os.system
  - os.popen
  - os.execv
  - os.execve
  - os.execl
  - os.execle
  - os.execlp
  - os.execvp
  - os.execvpe
  - os.spawnv
  - os.spawnl
  - os.spawnve
  - os.spawnle
  - os.fork
  - os.forkpty
  - os.kill
  - os.killpg
  - os.remove
  - os.unlink
  - os.rmdir
  - os.removedirs
  - subprocess.call
  - subprocess.check_call
  - subprocess.check_output
  - subprocess.run
  - subprocess.Popen
  - shutil.rmtree
  - shutil.move
  - shutil.copyfile
  - pathlib.Path.unlink
  - pathlib.Path.write_text
  - pathlib.Path.write_bytes
  - importlib.import_module
  - __import__
  - pickle.loads
  - marshal.loads
  - socketserver.TCPServer

# Substrings that must never appear in string or bytes literals.
blocked_literals:
  - /etc/shadow
  - /.ssh/
  - AWS_SECRET_ACCESS_KEY
  - GITHUB_TOKEN
  - -----BEGIN PRIVATE KEY-----

# Hard limits. Oversized input is denied rather than truncated.
max_source_bytes: 1048576
max_ast_nodes: 400000
