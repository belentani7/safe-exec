name: CI (python)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip

      - name: Install SAFE-EXEC with test dependencies
        run: python -m pip install -e ".[test]"

      - name: Compile package
        run: python -m compileall -q safeexec tests

      - name: Run test suite
        run: python -m pytest

      - name: Verify CLI static scan
        run: safe-exec scan samples/safe_sample.py
